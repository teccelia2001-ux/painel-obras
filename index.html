<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obras Teccel - Sistema de Gestão de Obras</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen">

<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col -translate-x-full lg:translate-x-0 transition-transform">
    <div class="h-16 flex items-center gap-3 px-5 border-b border-slate-100 dark:border-slate-700">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-red-600 to-red-700 flex items-center justify-center text-white font-black text-sm shadow-sm shadow-red-600/30">T</div>
      <div>
        <p class="text-sm font-bold text-slate-800 dark:text-white leading-tight">Teccel</p>
        <p class="text-[11px] text-slate-400 dark:text-slate-500">Teccel Engenharia</p>
      </div>
      <button onclick="toggleSidebar()" class="ml-auto lg:hidden text-slate-400" aria-label="Fechar menu">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <nav class="flex-1 p-3 space-y-1" id="nav"></nav>
    <div class="p-3 border-t border-slate-100 dark:border-slate-700">
      <div class="flex items-center gap-3 px-2 py-2">
        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-slate-600 to-slate-800 flex items-center justify-center text-white text-xs font-bold">AD</div>
        <div class="min-w-0">
          <p class="text-sm font-semibold text-slate-800 dark:text-slate-100 truncate">Meu Perfil</p>
          <p class="text-[11px] text-slate-400">Administrador</p>
        </div>
      </div>
      <button class="nav-item w-full text-red-600 dark:text-red-400">
        <svg style="width:18px;height:18px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Sair da conta
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center gap-3 px-4 lg:px-8 sticky top-0 z-30">
      <button onclick="toggleSidebar()" class="lg:hidden text-slate-500" aria-label="Abrir menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <span id="crumb" class="text-sm font-semibold text-slate-600 dark:text-slate-300">Dashboard</span>
      <div class="ml-auto flex items-center gap-2">
        <button onclick="toggleTheme()" id="themeBtn" class="w-9 h-9 rounded-xl border border-slate-200 dark:border-slate-600 flex items-center justify-center text-slate-500 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700"></button>
        <button onclick="loadObras(true)" class="px-3 h-9 rounded-xl border border-slate-200 dark:border-slate-600 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700">Atualizar</button>
      </div>
    </header>

    <main class="flex-1 p-4 lg:p-8 max-w-[1600px] w-full mx-auto">
      <div id="loading" class="min-h-[60vh] flex items-center justify-center">
        <div class="text-center space-y-3">
          <div class="spinner mx-auto"></div>
          <p class="text-sm font-medium text-gray-500 dark:text-slate-400">Carregando dashboard...</p>
        </div>
      </div>
      <div id="page" class="hidden"></div>
    </main>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
